search --no-floppy --file --set=root /typewriter-boot
insmod all_video
loadfont unicode
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
set timeout=7
set timeout_style=menu
set color_normal=light-gray/black
set color_highlight=black/light-gray

function boot_typewriter {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 systemd.show_status=false vt.global_cursor_default=0 $1
    initrd /live/initrd.img
}
menuentry 'Try Typewriter with BYOK Studio' {
    boot_typewriter typewriter.app=byok-studio
}
menuentry 'Try Typewriter with Obsidian' {
    boot_typewriter typewriter.app=obsidian
}
menuentry 'Install Typewriter' {
    boot_typewriter typewriter.install=1
}
