modules-search: [local]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: true
dont-chroot: false
branding: nordos
instances:
  - id: installed
    module: shellprocess
    config: shellprocess-installed.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - luksbootkeyfile
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - shellprocess@installed
      - initramfscfg
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
