name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s distribution -p 'test_*.py' -v

  build:
    uses: cutefishos/.github/.github/workflows/build.yml@main
    with:
      dependencies: icons cutefish-toolkit cutefish-framework
      test-projects: >-
        system/library/core/tests system/services/applications/runtime/tests system/services/session/tests system/services/desktop/tests
        tests/battery tests/language tests/nightlight tests/permissions
        tests/power tests/platform-power tests/session-composition tests/privacy tests/screenrecorder tests/applicationsfolder
        system/services/desktop/idle
